version: '3.8'

services:
  # Access to MySQL Converter Application
  converter:
    build: .
    container_name: access-mysql-converter
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs
      - ./logs:/app/logs
    environment:
      - FLASK_ENV=production
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=rootpassword
    depends_on:
      - mysql
    networks:
      - converter-network
    restart: unless-stopped

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: converter-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=converted_db
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - converter-network
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password

  # Nginx (Optional - for serving frontend)
  nginx:
    image: nginx:alpine
    container_name: converter-nginx
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - converter
    networks:
      - converter-network
    restart: unless-stopped

volumes:
  mysql-data:

networks:
  converter-network:
    driver: bridge
